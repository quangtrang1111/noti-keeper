plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.trang.notikeeper'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.trang.notikeeper'
        minSdk 24
        versionCode 4
        versionName '2.0'
    }

    // Same applicationId: users install one build or the other, never both.
    flavorDimensions = ['rom']
    productFlavors {
        xiaomi {
            dimension 'rom'
            // Must stay below 23 for XiaomiGuard to write a private Settings.System key.
            targetSdk 22
        }
        universal {
            dimension 'rom'
            // Below 28, Android 14+ warns "built for an older version of Android".
            targetSdk 28
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    signingConfigs {
        // CI signs with the release key from env vars; local builds fall back to the debug key.
        sideload {
            def ks = System.getenv('KEYSTORE_FILE')
            storeFile file(ks ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword ks ? System.getenv('KEYSTORE_PASSWORD') : 'android'
            keyAlias ks ? System.getenv('KEY_ALIAS') : 'androiddebugkey'
            keyPassword ks ? System.getenv('KEY_PASSWORD') : 'android'
            enableV1Signing false
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.sideload
            vcsInfo.include false
        }
    }

    packaging {
        resources {
            excludes += 'META-INF/com/android/build/gradle/app-metadata.properties'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
